name: DaBrawl server checks

on:
  push:
    paths:
      - "server/**"
      - ".github/workflows/server-check.yml"
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/server-check.yml"

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm run check
      - run: npm test
      - name: Build production container image
        run: docker build --tag dabrawl-server-check .
