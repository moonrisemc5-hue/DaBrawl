name: DaBrawl server checks

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/server.yml"
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/server.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install server dependencies
        working-directory: server
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        working-directory: server
        run: npm run check
      - name: Run server unit tests
        working-directory: server
        run: npm test
      - name: Build production Docker image
        run: docker build -f server/Dockerfile -t dabrawl-server:ci .
      - name: Smoke-test container startup and health endpoint
        run: |
          docker run -d --name dabrawl-server-smoke -p 8080:8080 dabrawl-server:ci
          trap 'docker logs dabrawl-server-smoke; docker rm -f dabrawl-server-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8080/health > /tmp/dabrawl-health.json; then
              break
            fi
            sleep 1
          done
          cat /tmp/dabrawl-health.json
          grep -q '"ok":true' /tmp/dabrawl-health.json
          grep -q '"authConfigured":false' /tmp/dabrawl-health.json
          readiness_code=$(curl --silent --output /tmp/dabrawl-ready.json --write-out '%{http_code}' http://127.0.0.1:8080/ready)
          cat /tmp/dabrawl-ready.json
          test "$readiness_code" = "503"
          grep -q 'Missing SUPABASE_URL or SUPABASE_ANON_KEY' /tmp/dabrawl-ready.json
